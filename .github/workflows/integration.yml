name: Prepare dependency lock
on:
  push:
    branches: [review/puna-isolated-integration]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Return generated dependency metadata
        run: node -e "console.log('PUNA_LOCK_START'); console.log(require('fs').readFileSync('package-lock.json').toString('base64')); console.log('PUNA_LOCK_END')"
