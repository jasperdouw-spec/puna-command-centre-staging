name: Isolated application integration
on:
  push:
    branches: [review/puna-isolated-integration]
permissions:
  contents: read
concurrency:
  group: puna-synthetic-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-only
          MARIADB_DATABASE: puna_ci_synthetic
          MARIADB_USER: puna_ci
          MARIADB_PASSWORD: synthetic-ci-user-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: puna_ci_synthetic
      DB_USER: puna_ci
      DB_PASSWORD: synthetic-ci-user-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build
      - name: Test actual production application over local HTTPS
        run: timeout 240s node tests/integration.mjs
      - name: Upload synthetic visual review only
        uses: actions/upload-artifact@v4
        with:
          name: puna-visual-review-${{ github.sha }}
          path: test-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: error
