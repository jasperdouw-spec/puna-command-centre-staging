name: Isolated application integration
on:
  push:
    branches: [review/puna-isolated-integration]
permissions:
  contents: read
concurrency:
  group: puna-synthetic-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-only
          MARIADB_DATABASE: puna_ci_synthetic
          MARIADB_USER: puna_ci
          MARIADB_PASSWORD: synthetic-ci-user-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: puna_ci_synthetic
      DB_USER: puna_ci
      DB_PASSWORD: synthetic-ci-user-only
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match the observed Hostinger npm version
        run: |
          npm install --global npm@10.9.9 --no-audit --no-fund
          node --version
          npm --version
      - name: Reproduce failure from the exact received source archive
        env:
          NODE_ENV: production
        run: |
          mkdir -p test-artifacts/build-evidence
          curl --fail --silent --show-error --location --max-time 60 \
            https://staging.punaempanadas.ca/unified-puna_20261020_091655.zip \
            -o "$RUNNER_TEMP/received.zip"
          echo "cc4f9c77b4a527f007df2e2b804b8811d9e78efe5864b2adb3e7182f0f18592d  $RUNNER_TEMP/received.zip" | sha256sum --check
          python3 scripts/hostinger-build-check.py baseline "$RUNNER_TEMP/received.zip" "$RUNNER_TEMP/puna-baseline"
          cd "$RUNNER_TEMP/puna-baseline"
          npm install --no-audit --no-fund
          node -e 'for(const p of ["typescript","@tailwindcss/postcss","tailwindcss","tw-animate-css"]){try{require.resolve(p);throw new Error(p+" unexpectedly installed")}catch(e){if(e.code!=="MODULE_NOT_FOUND")throw e;console.log("CONFIRMED OMITTED "+p)}}'
          # Reproduce Hostinger's WASM fallback without requiring its old libc.
          mkdir -p "$RUNNER_TEMP/baseline-native-swc"
          for p in node_modules/@next/swc-linux-x64-*; do
            if [ -d "$p" ]; then mv "$p" "$RUNNER_TEMP/baseline-native-swc/"; fi
          done
          set +e
          timeout 180s npm run build > "$GITHUB_WORKSPACE/test-artifacts/build-evidence/baseline-build.log" 2>&1
          result=$?
          set -e
          cat "$GITHUB_WORKSPACE/test-artifacts/build-evidence/baseline-build.log"
          test "$result" -eq 1
          grep -F "Can't resolve '@/components/ui/sheet'" "$GITHUB_WORKSPACE/test-artifacts/build-evidence/baseline-build.log"
          grep -F "Can't resolve '@/lib/db'" "$GITHUB_WORKSPACE/test-artifacts/build-evidence/baseline-build.log"
      - name: Package committed repair and extract a clean deployment root
        run: |
          python3 scripts/package-source.py test-artifacts/deployment
          python3 scripts/hostinger-build-check.py candidate test-artifacts/deployment/puna-source.zip "$RUNNER_TEMP/puna-candidate"
      - name: Install locked build dependencies in the production environment
        env:
          NODE_ENV: production
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          npm ci --no-audit --no-fund
          node -e 'for(const p of ["typescript","@tailwindcss/postcss","tailwindcss","tw-animate-css","playwright"]){console.log("INSTALLED "+p+" "+require.resolve(p))}'
          npx playwright install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/candidate-native-swc"
          for p in node_modules/@next/swc-linux-x64-*; do
            if [ -d "$p" ]; then mv "$p" "$RUNNER_TEMP/candidate-native-swc/"; fi
          done
      - name: Typecheck and build the freshly extracted candidate
        env:
          NODE_ENV: production
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          npm run typecheck
          npm run build
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
      - name: Test actual standalone production application over local HTTPS
        env:
          PUNA_TEST_STANDALONE: 'true'
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          timeout 240s node tests/integration.mjs
      - name: Collect synthetic screenshots
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/puna-candidate/test-artifacts/screenshots" ]; then
            cp -R "$RUNNER_TEMP/puna-candidate/test-artifacts/screenshots" test-artifacts/
          fi
      - name: Upload synthetic visual review only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: puna-visual-review-${{ github.sha }}
          path: test-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload source archive and non-secret build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: puna-deployment-review-${{ github.sha }}
          path: |
            test-artifacts/deployment/
            test-artifacts/build-evidence/
          retention-days: 7
          if-no-files-found: ignore

