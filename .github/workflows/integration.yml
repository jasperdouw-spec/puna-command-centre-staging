name: Isolated application integration
on:
  push:
    branches: [review/puna-isolated-integration, codex/puna-phase-b-20261108, codex/live-inventory-20261111, codex/kitchen-ux-20261112, codex/unified-menu-20261112]
permissions:
  contents: read
concurrency:
  group: puna-synthetic-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: synthetic-ci-root-only
          MARIADB_DATABASE: puna_ci_synthetic
          MARIADB_USER: puna_ci
          MARIADB_PASSWORD: synthetic-ci-user-only
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3307'
      DB_NAME: puna_ci_synthetic
      DB_USER: puna_ci
      DB_PASSWORD: synthetic-ci-user-only
      NEXT_TELEMETRY_DISABLED: '1'
      PUNA_PHASE_C_TESTS: 'true'
      PUNA_PHASE_D_TESTS: 'true'
      PUNA_DISPOSABLE_LOCAL_TESTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match the observed Hostinger npm version
        run: |
          npm install --global npm@10.9.9 --no-audit --no-fund
          node --version
          npm --version
      - name: Package committed candidate and extract a clean deployment root
        run: |
          python3 scripts/package-source.py test-artifacts/deployment
          python3 scripts/hostinger-build-check.py candidate test-artifacts/deployment/puna-source.zip "$RUNNER_TEMP/puna-candidate"
      - name: Install locked build dependencies in the production environment
        env:
          NODE_ENV: production
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          npm ci --no-audit --no-fund
          node -e 'for(const p of ["typescript","@tailwindcss/postcss","tailwindcss","tw-animate-css","playwright"]){const m=JSON.parse(require("node:fs").readFileSync("node_modules/"+p+"/package.json","utf8"));console.log("INSTALLED "+p+" "+m.version)}'
          npx playwright install --with-deps chromium
      - name: Isolate synthetic checkout secrets
        run: |
          echo "PUNA_TEST_RUN_ID=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          for puna_key in PUNA_D1_SECRET PUNA_D1_FIXTURE_SECRET; do
            puna_test_secret=$(openssl rand -hex 32)
            echo "::add-mask::$puna_test_secret"
            echo "$puna_key=$puna_test_secret" >> "$GITHUB_ENV"
          done
          echo "PUNA_D1_ORIGIN=https://localhost:3443" >> "$GITHUB_ENV"
      - name: Typecheck and build the freshly extracted candidate
        env:
          NODE_ENV: production
          NEXT_TEST_WASM: '1'
          PUNA_HOSTINGER_STANDALONE: 'true'
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          node -e 'require("next/dist/build/swc").loadBindings().then(b=>{require("node:assert/strict").equal(b.isWasm,true);console.log("VERIFIED WASM compiler")})'
          node tests/domain.mjs
          node tests/sales-domain.mjs
          node tests/sales-dashboard-domain.mjs
          node tests/kitchen-domain.mjs
          node tests/live-inventory-domain.mjs
          node tests/chart-domain.mjs
          node tests/service-domain.mjs
          npm run typecheck
          npm run build
          cp -R public .next/standalone/public
          cp -R .next/static .next/standalone/.next/static
      - name: Test actual standalone production application over local HTTPS
        env:
          PUNA_TEST_STANDALONE: 'true'
          PUNA_CI_DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          cd "$RUNNER_TEMP/puna-candidate"
          timeout 600s node tests/integration.mjs
      - name: Collect synthetic screenshots
        if: ${{ always() }}
        run: |
          if [ -d "$RUNNER_TEMP/puna-candidate/test-artifacts/screenshots" ]; then
            cp -R "$RUNNER_TEMP/puna-candidate/test-artifacts/screenshots" test-artifacts/
          fi
      - name: Retain selected synthetic review images in text evidence
        if: ${{ always() }}
        run: |
          python3 - <<'PYIMAGE'
          import pathlib, base64
          names=['unified-menu-before-desktop.png','unified-menu-before-mobile.png','d1-08-mixed-checkout.png','inventory-kitchen-tablet.png','dashboard-chart-before.png','dashboard-chart-after.png','dashboard-cards-before.png','dashboard-cards-after.png','inventory-batch-tools.png','inventory-kitchen-overview.png','inventory-display-panel-desktop.png','inventory-display-panel-mobile.png','inventory-baseline-mobile-hero.png','inventory-preserved-mobile-hero.png','inventory-baseline-desktop-story.png','inventory-preserved-desktop-story.png','inventory-baseline-desktop-hero.png','inventory-preserved-desktop-hero.png','inventory-baseline-mobile-story.png','inventory-preserved-mobile-story.png']
          for name in names:
              path=pathlib.Path('test-artifacts/screenshots')/name
              if not path.exists(): continue
              raw=path.read_bytes()
              if len(raw)>2000000: continue
              value=base64.b64encode(raw).decode()
              for n in range(0,len(value),8000): print('PUNA_VISUAL '+name+' '+str(n)+' '+value[n:n+8000])
          PYIMAGE
      - name: Upload synthetic visual review only
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: puna-visual-review-${{ github.sha }}
          path: test-artifacts/screenshots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload source archive and non-secret build evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: puna-deployment-review-${{ github.sha }}
          path: |
            test-artifacts/deployment/
            test-artifacts/build-evidence/
          retention-days: 7
          if-no-files-found: ignore

